---
- name: Back up running configuration from lab network devices
  hosts: lab_network
  gather_facts: false

  vars:
    backup_output_dir: ./artifacts/config-backups

  tasks:
    - name: Ensure local backup directory exists
      ansible.builtin.file:
        path: "{{ backup_output_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      run_once: true

    - name: Collect running configuration
      ansible.netcommon.cli_command:
        command: show running-config
      register: running_config

    - name: Write running configuration to local sanitized lab artifact path
      ansible.builtin.copy:
        content: "{{ running_config.stdout }}\n"
        dest: "{{ backup_output_dir }}/{{ inventory_hostname }}-running-config.txt"
        mode: "0600"
      delegate_to: localhost
