<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Ansible control flow placeholder</title>
  <desc id="desc">Sanitized placeholder diagram showing inventory and playbooks flowing through an Ansible control node to lab devices on a management network.</desc>
  <rect width="960" height="380" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Ansible Control Flow</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Placeholder visual for README/demo use.</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827" stroke="#334155" stroke-width="2">
    <rect x="50" y="125" width="170" height="70" rx="8" fill="#f1f5f9"/>
    <text x="88" y="154" stroke="none">Inventory</text>
    <text x="78" y="176" stroke="none">placeholder hosts</text>
    <rect x="50" y="230" width="170" height="70" rx="8" fill="#f1f5f9"/>
    <text x="90" y="260" stroke="none">Playbooks</text>
    <text x="88" y="282" stroke="none">read-only first</text>
    <rect x="330" y="175" width="190" height="80" rx="8" fill="#dcfce7"/>
    <text x="368" y="208" stroke="none">Ansible control</text>
    <text x="380" y="232" stroke="none">workflow</text>
    <rect x="630" y="175" width="250" height="80" rx="8" fill="#dbeafe"/>
    <text x="676" y="207" stroke="none">Management network</text>
    <text x="690" y="231" stroke="none">lab-r1 / lab-r2 / lab-sw1</text>
    <line x1="220" y1="160" x2="330" y2="205"/>
    <line x1="220" y1="265" x2="330" y2="225"/>
    <line x1="520" y1="215" x2="630" y2="215"/>
  </g>
</svg>
