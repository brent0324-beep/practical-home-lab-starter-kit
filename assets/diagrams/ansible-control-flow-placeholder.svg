<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Ansible control flow example</title>
  <desc id="desc">A clean example-only Ansible workflow showing inventory, group variables, read-only playbooks, control node, management network, and local artifacts.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.node{stroke:#334155;stroke-width:1.7}.text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.muted{fill:#475569}.small{font-size:14px}.label{font-size:16px;font-weight:700}.title{font-size:28px;font-weight:700}.line{stroke:#64748b;stroke-width:2.2;fill:none}.dash{stroke-dasharray:7 6}.chip{fill:#ecfdf5;stroke:#22c55e;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="460"/>
  <text class="text title" x="42" y="52">Example Ansible Control Flow</text>
  <text class="text muted small" x="42" y="78">Sanitized visual. Start with read-only validation before configuration changes.</text>
  <rect class="panel" x="32" y="104" width="1036" height="305" rx="18"/>
  <rect class="node" x="70" y="145" width="180" height="70" rx="14" fill="#f1f5f9"/>
  <text class="text label" x="120" y="176">Inventory</text>
  <text class="text muted small" x="100" y="198">example-only devices</text>
  <rect class="node" x="70" y="250" width="180" height="70" rx="14" fill="#f1f5f9"/>
  <text class="text label" x="115" y="281">Group vars</text>
  <text class="text muted small" x="108" y="303">vendor defaults</text>
  <rect class="node" x="330" y="197" width="210" height="86" rx="16" fill="#dcfce7"/>
  <text class="text label" x="372" y="231">Control node</text>
  <text class="text muted small" x="369" y="255">runs safe playbooks</text>
  <rect class="node" x="620" y="145" width="190" height="70" rx="14" fill="#dbeafe"/>
  <text class="text label" x="653" y="176">Show commands</text>
  <text class="text muted small" x="658" y="198">read-only checks</text>
  <rect class="node" x="620" y="250" width="190" height="70" rx="14" fill="#e0f2fe"/>
  <text class="text label" x="652" y="281">Local artifacts</text>
  <text class="text muted small" x="648" y="303">private review only</text>
  <rect class="node" x="875" y="197" width="150" height="86" rx="16" fill="#ede9fe"/>
  <text class="text label" x="910" y="231">Lab nodes</text>
  <text class="text muted small" x="907" y="255">private mgmt</text>
  <path class="line" marker-end="url(#arrow)" d="M250 180 C285 180 292 215 330 224"/>
  <path class="line" marker-end="url(#arrow)" d="M250 285 C285 285 292 262 330 252"/>
  <path class="line" marker-end="url(#arrow)" d="M540 232 C573 218 585 190 620 180"/>
  <path class="line" marker-end="url(#arrow)" d="M810 180 C840 185 852 212 875 226"/>
  <path class="line dash" marker-end="url(#arrow)" d="M540 252 C574 266 587 283 620 285"/>
  <rect class="chip" x="70" y="355" width="300" height="32" rx="16"/>
  <text class="text muted small" x="92" y="376">Review output before sharing publicly</text>
</svg>
