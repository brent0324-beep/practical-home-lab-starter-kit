<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Golden Path operational workflow</title>
  <desc id="desc">A sanitized workflow from repository orientation through lab host baseline, GNS3 topology, Ansible inventory, read-only checks, validation, redaction, and a private review artifact.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .node{stroke:#334155;stroke-width:1.6}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
      .muted{fill:#475569}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:15px}
      .label{font-size:16px;font-weight:700}
      .small{font-size:13px}
      .line{stroke:#64748b;stroke-width:2.3;fill:none}
      .badge{fill:#ecfdf5;stroke:#16a34a;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="520"/>
  <text class="text title" x="48" y="58">Golden Path Operational Workflow</text>
  <text class="text muted subtitle" x="48" y="84">Sanitized lab validation flow: small first, read-only first, review before publishing.</text>

  <rect class="panel" x="38" y="118" width="1104" height="318" rx="16"/>

  <rect class="node" x="72" y="176" width="142" height="92" rx="12" fill="#f1f5f9"/>
  <text class="text label" x="105" y="206">Repo</text>
  <text class="text label" x="88" y="226">orientation</text>
  <text class="text muted small" x="94" y="250">README and docs</text>

  <rect class="node" x="246" y="176" width="142" height="92" rx="12" fill="#ecfdf5"/>
  <text class="text label" x="278" y="206">Lab host</text>
  <text class="text label" x="282" y="226">baseline</text>
  <text class="text muted small" x="273" y="250">Linux, SSH, UFW</text>

  <rect class="node" x="420" y="176" width="142" height="92" rx="12" fill="#eff6ff"/>
  <text class="text label" x="454" y="206">GNS3</text>
  <text class="text label" x="445" y="226">topology</text>
  <text class="text muted small" x="435" y="250">small mgmt lab</text>

  <rect class="node" x="594" y="176" width="142" height="92" rx="12" fill="#eff6ff"/>
  <text class="text label" x="625" y="206">Ansible</text>
  <text class="text label" x="622" y="226">inventory</text>
  <text class="text muted small" x="612" y="250">placeholder values</text>

  <rect class="node" x="768" y="176" width="142" height="92" rx="12" fill="#e0f2fe"/>
  <text class="text label" x="802" y="206">Read-only</text>
  <text class="text label" x="813" y="226">checks</text>
  <text class="text muted small" x="792" y="250">reachability first</text>

  <rect class="node" x="942" y="146" width="154" height="70" rx="12" fill="#ecfdf5"/>
  <text class="text label" x="973" y="176">Validation</text>
  <text class="text muted small" x="973" y="198">repo guardrails</text>

  <rect class="node" x="942" y="252" width="154" height="70" rx="12" fill="#f5f3ff"/>
  <text class="text label" x="972" y="282">Review</text>
  <text class="text label" x="968" y="302">artifact</text>

  <path class="line" marker-end="url(#arrow)" d="M214 222 L246 222"/>
  <path class="line" marker-end="url(#arrow)" d="M388 222 L420 222"/>
  <path class="line" marker-end="url(#arrow)" d="M562 222 L594 222"/>
  <path class="line" marker-end="url(#arrow)" d="M736 222 L768 222"/>
  <path class="line" marker-end="url(#arrow)" d="M910 218 C928 208 928 190 942 184"/>
  <path class="line" marker-end="url(#arrow)" d="M1019 216 L1019 252"/>

  <rect class="badge" x="72" y="346" width="320" height="34" rx="17"/>
  <text class="text muted small" x="95" y="368">No private details in public examples</text>

  <rect class="badge" x="430" y="346" width="320" height="34" rx="17"/>
  <text class="text muted small" x="455" y="368">Run read-only checks before changes</text>

  <rect class="badge" x="788" y="346" width="308" height="34" rx="17"/>
  <text class="text muted small" x="812" y="368">Validate and redact before sharing</text>
</svg>
