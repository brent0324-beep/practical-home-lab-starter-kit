<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized lab topology example</title>
  <desc id="desc">A clean example-only topology showing a remote admin path, Linux lab host, GNS3 server, management network, virtual network nodes, and Ansible workflow.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.node{stroke:#334155;stroke-width:1.7}.text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.muted{fill:#475569}.small{font-size:14px}.label{font-size:16px;font-weight:700}.title{font-size:28px;font-weight:700}.line{stroke:#64748b;stroke-width:2.2;fill:none}.dash{stroke-dasharray:7 6}.chip{fill:#eef2ff;stroke:#6366f1;stroke-width:1}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="520"/>
  <text class="text title" x="42" y="52">Example Home Lab Topology</text>
  <text class="text muted small" x="42" y="78">Sanitized visual for README/demo use. Replace with reviewed rendered exports later.</text>
  <rect class="panel" x="32" y="104" width="1036" height="360" rx="18"/>
  <rect class="node" x="70" y="180" width="170" height="84" rx="14" fill="#dbeafe"/>
  <text class="text label" x="104" y="214">Admin device</text>
  <text class="text muted small" x="101" y="239">trusted operator</text>
  <rect class="node" x="300" y="180" width="170" height="84" rx="14" fill="#fef3c7"/>
  <text class="text label" x="328" y="214">Home edge</text>
  <text class="text muted small" x="333" y="239">firewall path</text>
  <rect class="node" x="535" y="150" width="210" height="144" rx="16" fill="#dcfce7"/>
  <text class="text label" x="584" y="187">Linux lab host</text>
  <text class="text muted small" x="579" y="213">SSH + UFW</text>
  <text class="text muted small" x="562" y="237">docs + validation</text>
  <text class="text muted small" x="566" y="261">Ansible control</text>
  <rect class="node" x="820" y="150" width="190" height="144" rx="16" fill="#ede9fe"/>
  <text class="text label" x="864" y="187">GNS3 server</text>
  <text class="text muted small" x="853" y="213">virtual routers</text>
  <text class="text muted small" x="856" y="237">virtual switches</text>
  <text class="text muted small" x="854" y="261">lab projects</text>
  <rect class="node" x="535" y="350" width="475" height="72" rx="16" fill="#e0f2fe"/>
  <text class="text label" x="656" y="384">Private management network</text>
  <text class="text muted small" x="662" y="407">example-only addressing and labels</text>
  <path class="line" marker-end="url(#arrow)" d="M240 222 H300"/>
  <path class="line" marker-end="url(#arrow)" d="M470 222 H535"/>
  <path class="line" marker-end="url(#arrow)" d="M745 222 H820"/>
  <path class="line" marker-end="url(#arrow)" d="M640 294 V350"/>
  <path class="line" marker-end="url(#arrow)" d="M915 294 V350"/>
  <path class="line dash" marker-end="url(#arrow)" d="M745 250 C785 305 803 320 860 350"/>
  <rect class="chip" x="72" y="405" width="238" height="34" rx="17"/>
  <text class="text muted small" x="93" y="427">No real hostnames or public addresses</text>
</svg>
