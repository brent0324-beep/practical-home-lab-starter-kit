<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Lab topology placeholder</title>
  <desc id="desc">Sanitized placeholder diagram showing admin workstation, home firewall, Linux lab host, GNS3 server, management network, and virtual devices.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Practical Home Lab Topology</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Placeholder visual. Replace later with a reviewed rendered Mermaid export.</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827" stroke="#334155" stroke-width="2">
    <rect x="52" y="145" width="160" height="70" rx="8" fill="#e0f2fe"/>
    <text x="78" y="175" stroke="none">Remote admin</text>
    <text x="88" y="197" stroke="none">workstation</text>
    <rect x="270" y="145" width="160" height="70" rx="8" fill="#fef3c7"/>
    <text x="302" y="175" stroke="none">Home router</text>
    <text x="310" y="197" stroke="none">/ firewall</text>
    <rect x="490" y="135" width="180" height="90" rx="8" fill="#dcfce7"/>
    <text x="528" y="172" stroke="none">Linux lab host</text>
    <text x="526" y="196" stroke="none">SSH / UFW / docs</text>
    <rect x="730" y="135" width="170" height="90" rx="8" fill="#ede9fe"/>
    <text x="775" y="172" stroke="none">GNS3</text>
    <text x="758" y="196" stroke="none">virtual nodes</text>
    <rect x="490" y="290" width="410" height="70" rx="8" fill="#dbeafe"/>
    <text x="602" y="320" stroke="none">Management network</text>
    <text x="630" y="342" stroke="none">private lab subnet</text>
    <line x1="212" y1="180" x2="270" y2="180"/>
    <line x1="430" y1="180" x2="490" y2="180"/>
    <line x1="670" y1="180" x2="730" y2="180"/>
    <line x1="580" y1="225" x2="580" y2="290"/>
    <line x1="815" y1="225" x2="815" y2="290"/>
  </g>
</svg>
