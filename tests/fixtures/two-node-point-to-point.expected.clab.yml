name: two-node-ptp
mgmt:
  ipv4-subnet: 172.30.90.0/24
topology:
  defaults:
    labels:
      io.labctl.engine: labctl
      io.labctl.managed: 'true'
  links:
    - endpoints:
        - router-a:eth1
        - router-b:eth1
  nodes:
    router-a:
      binds:
        - /opt/products/practical-home-lab-starter-kit/labs/examples/two-node-point-to-point/startup/router-a.cfg:/tmp/router-a.cfg:ro
      env:
        ASN: '65001'
        PEER: router-b
      image: docker.io/nicolaka/netshoot:v0.16
      kind: linux
      mgmt-ipv4: 172.30.90.111
      startup-config: /opt/products/practical-home-lab-starter-kit/labs/examples/two-node-point-to-point/startup/router-a.cfg
    router-b:
      binds:
        - /opt/products/practical-home-lab-starter-kit/labs/examples/two-node-point-to-point/startup/router-b.cfg:/tmp/router-b.cfg:ro
      env:
        ASN: '65002'
        PEER: router-a
      image: docker.io/nicolaka/netshoot:v0.16
      kind: linux
      mgmt-ipv4: 172.30.90.112
      startup-config: /opt/products/practical-home-lab-starter-kit/labs/examples/two-node-point-to-point/startup/router-b.cfg
